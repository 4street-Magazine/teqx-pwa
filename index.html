<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TeQx PWA</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0b0b0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192">
    
    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        teqxDark: '#0b0b0b',
                        teqxCard: '#161616',
                        teqxOrange: '#FF5722',
                        teqxOrangeHover: '#E64A19'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0b0b; color: #f3f3f3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="w-screen h-screen m-0 overflow-hidden flex flex-col bg-teqxDark">

    <!-- Operational Main Header -->
    <header class="px-6 py-4 flex justify-between items-center z-40 bg-teqxDark/95 backdrop-blur-md border-b border-neutral-900">
        <div class="flex items-center space-x-2">
            <h1 class="text-2xl font-black tracking-tight text-white">Te<span class="text-teqxOrange">Q</span>x</h1>
        </div>
        <div id="header-action" class="flex items-center space-x-5">
            <button onclick="alert('Search feature activated')" class="text-neutral-300 hover:text-white transition"><i class="fa-solid fa-magnifying-glass text-xl"></i></button>
            <button onclick="alert('Menu options')" class="text-neutral-300 hover:text-white transition"><i class="fa-solid fa-ellipsis-vertical text-xl"></i></button>
        </div>
    </header>

    <!-- Dynamic Content Router Viewport -->
    <main id="viewport" class="flex-1 overflow-y-auto pb-24">
        <!-- Injected dynamically via JS router -->
    </main>

    <!-- Bottom Navigation Bar (Operational App Navigation) -->
    <nav class="absolute bottom-0 left-0 right-0 h-20 bg-teqxDark/95 backdrop-blur-lg border-t border-neutral-900 flex justify-around items-center px-4 z-50">
        <button onclick="switchTab('inbox')" id="nav-inbox" class="nav-btn flex flex-col items-center text-teqxOrange transition">
            <i class="fa-solid fa-comment-sms text-xl mb-1"></i>
            <span class="text-[11px] font-medium">Inbox</span>
        </button>
        <button onclick="switchTab('discover')" id="nav-discover" class="nav-btn flex flex-col items-center text-neutral-500 hover:text-neutral-300 transition">
            <i class="fa-solid fa-compass text-xl mb-1"></i>
            <span class="text-[11px] font-medium">Discover</span>
        </button>
        <button onclick="switchTab('orders')" id="nav-orders" class="nav-btn flex flex-col items-center text-neutral-500 hover:text-neutral-300 transition">
            <i class="fa-solid fa-bag-shopping text-xl mb-1"></i>
            <span class="text-[11px] font-medium">Orders</span>
        </button>
        <button onclick="switchTab('alerts')" id="nav-alerts" class="nav-btn flex flex-col items-center text-neutral-500 hover:text-neutral-300 transition">
            <i class="fa-solid fa-bell text-xl mb-1"></i>
            <span class="text-[11px] font-medium">Alerts</span>
        </button>
    </nav>

    <!-- Application Logic & PWA Registration -->
    <script>
        let currentTab = 'inbox';
        let activeChatStore = null;

        const stores = [
            { id: 'apex', name: 'Apex Tech', icon: 'fa-bolt', color: 'bg-blue-600', badge: '1', time: '10:42 AM', preview: 'Your order #APX-8821 has been shipped...' },
            { id: 'luxe', name: 'Luxe Attire', icon: 'fa-layer-group', color: 'bg-amber-600', badge: '3', time: '9:15 AM', preview: 'Check out our new premium autumn ...' },
            { id: 'nova', name: 'Nova Beauty', icon: 'fa-star', color: 'bg-purple-600', badge: '', time: 'Yesterday', preview: 'Get 20% off on your next glow kit refill.' },
            { id: 'fresh', name: 'Fresh Drops', icon: 'fa-droplet', color: 'bg-emerald-600', badge: '', time: '2 days ago', preview: 'Organic natural refreshers are back in stock!' },
            { id: 'sole', name: 'Sole Search', icon: 'fa-circle-stop', color: 'bg-orange-600', badge: '', time: '3 days ago', preview: 'Your premium raffle entry is now active.' }
        ];

        const ordersList = [
            { store: 'Apex Tech', icon: 'fa-bolt', color: 'bg-blue-600', item: 'Wireless Noise-Canc...', qty: 1, price: 'KSH 15,000', date: 'Today, 10:42 AM', status: 'PLACED' },
            { store: 'Luxe Attire', icon: 'fa-layer-group', color: 'bg-amber-600', item: 'Premium Cotton Hoo...', qty: 1, price: 'KSH 12,500', date: 'Yesterday', status: 'PLACED' },
            { store: 'Nova Beauty', icon: 'fa-star', color: 'bg-purple-600', item: 'HydraGlow Vitamin S...', qty: 2, price: 'KSH 6,800', date: '2 days ago', status: 'PLACED' }
        ];

        const alertsList = [
            { title: 'CRITICAL: Apex Tech uploaded 3 high-demand items to live catalog', time: '10 min ago', unread: true },
            { title: 'FLASH DROPS: Luxe Attire released an exclusive autumn stream lookbook', time: '1 hour ago', unread: true },
            { title: 'PRICE DROP: Nova Beauty unlocked 20% off flash event on glow kits', time: '5 hours ago', unread: false },
            { title: 'STOCK ALERT: Fresh Organic Vitality Pack successfully restocked', time: 'Yesterday', unread: false }
        ];

        function switchTab(tab) {
            currentTab = tab;
            activeChatStore = null;
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.replace('text-teqxOrange', 'text-neutral-500');
            });
            document.getElementById(`nav-${tab}`).classList.replace('text-neutral-500', 'text-teqxOrange');

            renderView();
        }

        function renderView() {
            const viewport = document.getElementById('viewport');
            const headerAction = document.getElementById('header-action');

            if (activeChatStore) {
                renderChatView(viewport, headerAction);
                return;
            }

            headerAction.innerHTML = `
                <button onclick="alert('Search feature activated')" class="text-neutral-300 hover:text-white transition"><i class="fa-solid fa-magnifying-glass text-xl"></i></button>
                <button onclick="alert('Menu options')" class="text-neutral-300 hover:text-white transition"><i class="fa-solid fa-ellipsis-vertical text-xl"></i></button>
            `;

            if (currentTab === 'inbox') {
                viewport.innerHTML = `
                    <div class="max-w-2xl mx-auto px-4 pt-4">
                        <p class="text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-3">Active Stores</p>
                        <div class="flex space-x-5 overflow-x-auto pb-4 pt-1">
                            ${stores.map(s => `
                                <div onclick="openChat('${s.id}')" class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                                    <div class="w-16 h-16 rounded-full ${s.color} flex items-center justify-center text-white text-2xl relative ring-2 ring-neutral-700 shadow-lg">
                                        <i class="fa-solid ${s.icon}"></i>
                                        <div class="absolute bottom-0 right-0 w-4 h-4 bg-emerald-500 rounded-full border-2 border-teqxDark"></div>
                                    </div>
                                    <span class="text-xs mt-2 text-neutral-300 font-medium">${s.name.split(' ')[0]}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="max-w-2xl mx-auto divide-y divide-neutral-900/80 mt-2">
                        ${stores.map(s => `
                            <div onclick="openChat('${s.id}')" class="px-4 py-4 flex items-center space-x-4 hover:bg-neutral-900/40 cursor-pointer transition">
                                <div class="w-14 h-14 rounded-full ${s.color} flex items-center justify-center text-white text-xl flex-shrink-0">
                                    <i class="fa-solid ${s.icon}"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex justify-between items-center mb-1">
                                        <h4 class="text-sm font-semibold text-white flex items-center space-x-1">
                                            <span>${s.name}</span>
                                            <i class="fa-solid fa-circle-check text-blue-400 text-xs"></i>
                                        </h4>
                                        <span class="text-xs text-neutral-500">${s.time}</span>
                                    </div>
                                    <p class="text-xs text-neutral-400 truncate">${s.preview}</p>
                                </div>
                                ${s.badge ? `<span class="bg-teqxOrange text-white text-xs font-bold px-2.5 py-0.5 rounded-full">${s.badge}</span>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTab === 'discover') {
                viewport.innerHTML = `
                    <div class="relative w-full h-full flex flex-col justify-between p-6 bg-gradient-to-b from-purple-950/40 via-teqxDark to-teqxDark">
                        <div class="flex justify-between items-center z-10 max-w-2xl mx-auto w-full">
                            <span class="bg-neutral-800/80 backdrop-blur text-neutral-300 text-xs px-3 py-1.5 rounded-full border border-neutral-700"><i class="fa-solid fa-circle text-[8px] text-neutral-400 mr-2"></i> LIVE VIDEO FEED</span>
                            <span class="text-xs text-neutral-400"><i class="fa-solid fa-circle text-[8px] text-teqxOrange mr-1"></i> Stream native</span>
                        </div>
                        <div class="absolute right-6 bottom-32 flex flex-col items-center space-y-4 z-20">
                            <button class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur flex items-center justify-center text-white hover:bg-teqxOrange transition"><i class="fa-solid fa-heart text-base"></i></button>
                            <span class="text-xs font-semibold text-neutral-300">1.4K</span>
                            <button class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur flex items-center justify-center text-white hover:bg-teqxOrange transition"><i class="fa-solid fa-comment text-base"></i></button>
                            <span class="text-xs font-semibold text-neutral-300">Discuss</span>
                            <button class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur flex items-center justify-center text-white hover:bg-teqxOrange transition"><i class="fa-solid fa-bookmark text-base"></i></button>
                            <span class="text-xs font-semibold text-neutral-300">Save</span>
                        </div>
                        <div class="max-w-md mx-auto w-full bg-neutral-900/90 backdrop-blur border border-neutral-800 p-5 rounded-3xl z-10 mb-6 shadow-xl">
                            <div class="flex items-center space-x-2.5 mb-2">
                                <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center text-white text-xs"><i class="fa-solid fa-star"></i></div>
                                <span class="font-bold text-sm text-white">Nova Beauty</span>
                                <i class="fa-solid fa-circle-check text-blue-400 text-xs"></i>
                            </div>
                            <p class="text-xs text-neutral-300 mb-2.5">HydraGlow Vitamin Serum & deep antioxidant repair cream.</p>
                            <div class="flex space-x-2 text-xs text-teqxOrange font-medium mb-4">
                                <span>#NovaBeauty</span>
                                <span>#GlowKit</span>
                            </div>
                            <button onclick="alert('Redirecting to Checkout')" class="w-full bg-gradient-to-r from-amber-500 to-teqxOrange text-white font-bold py-3 rounded-2xl shadow-lg hover:opacity-95 transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-bag-shopping"></i>
                                <span>SHOP NOW</span>
                            </button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'orders') {
                viewport.innerHTML = `
                    <div class="max-w-2xl mx-auto p-4">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-xs font-black tracking-widest text-teqxOrange">PLACED</span>
                            <span class="text-xs font-semibold text-teqxOrange">SHOWING ALL ORDERS</span>
                        </div>
                        <div class="space-y-4">
                            ${ordersList.map(o => `
                                <div class="bg-teqxCard border border-neutral-800/80 rounded-2xl p-5 shadow-md">
                                    <div class="flex justify-between items-center mb-3">
                                        <div class="flex items-center space-x-2.5">
                                            <div class="w-9 h-9 rounded-full ${o.color} flex items-center justify-center text-white text-xs">
                                                <i class="fa-solid ${o.icon}"></i>
                                            </div>
                                            <span class="font-bold text-sm text-white">${o.store}</span>
                                            <i class="fa-solid fa-circle-check text-blue-400 text-xs"></i>
                                        </div>
                                        <span class="font-bold text-xs tracking-wider text-white bg-neutral-800 px-3 py-1 rounded-md">${o.status}</span>
                                    </div>
                                    <div class="flex items-center space-x-4 bg-neutral-900/60 p-3 rounded-xl">
                                        <div class="w-14 h-14 bg-orange-50/10 rounded-xl flex items-center justify-center text-teqxOrange text-2xl">
                                            <i class="fa-solid ${o.icon}"></i>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <div class="flex justify-between items-start">
                                                <h4 class="text-xs font-semibold text-white truncate">${o.item} <span class="text-neutral-500">x${o.qty}</span></h4>
                                                <span class="text-xs font-bold text-teqxOrange">${o.price}</span>
                                            </div>
                                            <p class="text-[11px] text-neutral-400 mt-1">Ordered: ${o.date}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'alerts') {
                viewport.innerHTML = `
                    <div class="max-w-2xl mx-auto p-4">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-sm font-semibold text-neutral-300">Recent Alerts</h2>
                            <button class="text-xs text-neutral-400 hover:text-white"><i class="fa-solid fa-check-double text-base"></i></button>
                        </div>
                        <div class="space-y-3">
                            ${alertsList.map(a => `
                                <div class="bg-teqxCard border border-neutral-800/80 rounded-2xl p-4 flex items-start space-x-4 shadow-sm">
                                    <div class="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center text-teqxOrange flex-shrink-0 mt-0.5">
                                        <i class="fa-solid fa-bell text-base"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-xs font-medium text-neutral-200 leading-relaxed">${a.title}</p>
                                        <span class="text-[11px] text-neutral-500 mt-2 block">${a.time}</span>
                                    </div>
                                    ${a.unread ? '<span class="w-2.5 h-2.5 rounded-full bg-teqxOrange mt-1.5"></span>' : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        function openChat(storeId) {
            activeChatStore = stores.find(s => s.id === storeId);
            renderView();
        }

        function renderChatView(viewport, headerAction) {
            headerAction.innerHTML = `
                <button onclick="switchTab('inbox')" class="text-neutral-300 hover:text-white transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            `;

            viewport.innerHTML = `
                <div class="max-w-2xl mx-auto flex flex-col h-full bg-teqxDark">
                    <div class="px-4 py-3 bg-neutral-900/80 border-b border-neutral-800 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full ${activeChatStore.color} flex items-center justify-center text-white">
                                <i class="fa-solid ${activeChatStore.icon}"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-bold text-white flex items-center space-x-1">
                                    <span>${activeChatStore.name}</span>
                                    <i class="fa-solid fa-circle-check text-blue-400 text-xs"></i>
                                </h3>
                                <p class="text-[10px] text-emerald-400 font-medium">● Automated Store</p>
                            </div>
                        </div>
                        <div class="flex space-x-4 text-neutral-400">
                            <button><i class="fa-solid fa-phone"></i></button>
                            <button><i class="fa-solid fa-ellipsis-vertical"></i></button>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto p-4 space-y-4">
                        <div class="flex space-x-3">
                            <div class="w-8 h-8 rounded-full ${activeChatStore.color} flex items-center justify-center text-white text-xs flex-shrink-0 mt-1">
                                <i class="fa-solid ${activeChatStore.icon}"></i>
                            </div>
                            <div>
                                <div class="bg-teqxCard border border-neutral-800 p-4 rounded-2xl rounded-tl-none max-w-sm">
                                    <p class="text-xs text-neutral-200">Welcome to ${activeChatStore.name} Automated Assistant! Browse our featured products below.</p>
                                </div>
                                <span class="text-[10px] text-neutral-500 mt-1 block">Just now</span>
                            </div>
                        </div>

                        <div class="pl-11">
                            <div class="bg-gradient-to-b from-neutral-900 to-teqxCard border border-neutral-800 rounded-2xl p-4 max-w-xs shadow-lg">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="bg-teqxOrange/20 text-teqxOrange text-[10px] font-bold px-2.5 py-0.5 rounded-md">Catalog</span>
                                </div>
                                <div class="w-full h-32 bg-neutral-950 rounded-xl flex items-center justify-center mb-3 text-teqxOrange text-4xl">
                                    <i class="fa-solid ${activeChatStore.icon}"></i>
                                </div>
                                <h4 class="text-xs font-bold text-white truncate mb-1">Featured Item Collection</h4>
                                <p class="text-[10px] text-neutral-400 mb-3">High grade operational stock item.</p>
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-black text-white">$149.99</span>
                                    <button onclick="alert('Item added to active order queue!')" class="bg-gradient-to-r from-amber-500 to-teqxOrange text-white text-xs font-bold px-4 py-2 rounded-xl shadow">Buy Now</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="p-4 bg-neutral-950 border-t border-neutral-900 flex items-center space-x-3">
                        <button class="w-10 h-10 rounded-full bg-neutral-900 text-neutral-400 flex items-center justify-center"><i class="fa-solid fa-plus text-sm"></i></button>
                        <input type="text" placeholder="Message ${activeChatStore.name}..." class="flex-1 bg-neutral-900 border border-neutral-800 rounded-full px-5 py-2.5 text-xs text-white focus:outline-none focus:border-teqxOrange">
                        <button class="w-10 h-10 rounded-full bg-gradient-to-r from-amber-500 to-teqxOrange text-white flex items-center justify-center shadow"><i class="fa-solid fa-paper-plane text-xs"></i></button>
                    </div>
                </div>
            `;
        }

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).then(() => console.log('PWA ServiceWorker operational.'));
        }

        renderView();
    </script>
</body>
</html>
