<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TeQx – Chat, Discover, Shop</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap');
:root{--green:linear-gradient(135deg,#34e68a 0%,#12c062 50%,#079244 100%);--gglow:0 6px 16px rgba(18,192,98,.4);--grad:linear-gradient(135deg,#ff8f1c 0%,#ff5c0a 48%,#f03a0e 100%);--accent:#ff5c0a;--glow:0 6px 18px rgba(255,92,10,.42)}
[data-theme=dark]{--bg:#0a0a0c;--surf:#151519;--surf2:#1e1e24;--text:#f5f5f7;--mut:#9b9ba8;--line:rgba(255,255,255,.1);--nav:#1a1a20;--shadow:0 10px 34px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.5);--card:0 6px 20px rgba(0,0,0,.35);--cardline:rgba(255,255,255,.1)}
[data-theme=light]{--bg:#faf7f4;--surf:#fff;--surf2:#f3eee9;--text:#17120e;--mut:#6f655c;--line:rgba(30,20,10,.09);--nav:#fff;--shadow:0 -4px 24px rgba(40,25,10,.08),0 8px 24px rgba(40,25,10,.14);--card:0 6px 20px rgba(40,25,10,.1);--cardline:rgba(30,20,10,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.scroll{overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.hs{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}
.app{max-width:448px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg);transition:background .3s}
.hdr{padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 14px;background:var(--bg);z-index:10}
.hrow{display:flex;align-items:center;justify-content:space-between}
.hdr .sub{margin:8px 0 0}
.brand{font-size:26px;font-weight:800;letter-spacing:-.03em}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surf);border:1px solid var(--line);color:var(--accent);transition:transform .15s}
.ico:active{transform:scale(.92)}
main{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.page{flex:1;overflow-y:auto;scrollbar-width:none;padding:18px 20px 24px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 20px}
.stories{padding:4px 20px 16px}
.tray{flex-shrink:0;padding-top:16px;padding-bottom:10px;background:var(--bg);z-index:5}
.story{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:68px}
.ring{width:64px;height:64px;border-radius:50%;background:var(--grad);padding:2.5px;position:relative}
.ring i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--surf);font-size:26px;font-style:normal;border:2px solid var(--bg)}
.dot{position:absolute;right:1px;bottom:1px;width:15px;height:15px;border-radius:50%;background:#22c55e;border:3px solid var(--bg)}
.story span{font-size:12px;font-weight:600;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sect{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 20px 8px}
.row{display:flex;align-items:center;gap:14px;padding:14px 20px;width:100%;text-align:left;transition:background .15s}
.row:active{background:var(--surf)}
.av{width:52px;height:52px;border-radius:50%;background:var(--surf2);display:grid;place-items:center;font-size:24px;flex-shrink:0;border:1px solid var(--line)}
.grow{flex:1;min-width:0}
.nm{display:flex;align-items:center;gap:5px;font-size:15.5px;font-weight:700}
.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{font-size:13px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.tm{font-size:11.5px;color:var(--mut)}
.pill{font-size:11.5px;font-weight:700;color:#fff;background:var(--grad);border-radius:99px;min-width:21px;padding:2px 7px;text-align:center}
.chat{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(110% 50% at 100% 0%,rgba(255,92,10,.08),transparent 60%),radial-gradient(90% 45% at 0% 100%,rgba(18,192,98,.07),transparent 60%),var(--bg);z-index:20}
.chdr{display:flex;align-items:center;gap:11px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 11px;background:var(--surf);border-bottom:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.08);position:relative;z-index:2}
.back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surf2)}
.hav{position:relative;padding:2.5px;border-radius:50%;background:var(--grad);flex-shrink:0}
.hav .av{width:40px;height:40px;font-size:19px;border:2.5px solid var(--surf)}
.hav i{position:absolute;right:0;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2.5px solid var(--surf);box-sizing:border-box}
.ccat{font-size:12.5px;font-weight:600;color:var(--mut);margin-top:1px;animation:pop .25s ease}
.ctyp{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;margin-top:1px;animation:pop .25s ease}
.gtxt{background:linear-gradient(100deg,#8dffbd 0%,#18e07c 28%,#00b85c 50%,#18e07c 72%,#8dffbd 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gsh 1.5s linear infinite;filter:drop-shadow(0 0 6px rgba(24,224,124,.4))}
@keyframes gsh{to{background-position:-220% 0}}
.gd{display:inline-flex;gap:3px;align-items:center}.gd i{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(18,192,98,.65);animation:bl 1.1s infinite}.gd i:nth-child(2){animation-delay:.15s}.gd i:nth-child(3){animation-delay:.3s}
.on{font-size:12px;font-weight:600;color:#22c55e;margin-top:1px}
.msgs{flex:1;overflow-y:auto;scrollbar-width:none;padding:16px 14px 14px;display:flex;flex-direction:column;gap:12px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(18,192,98,.55);animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
.cat{padding:14px 30px 46px;margin:-2px -30px -28px;gap:22px;animation:pop .3s ease;background:transparent;flex-shrink:0}
.msgs>*{flex-shrink:0}
.prod{flex-shrink:0}
.prod{width:208px;flex-shrink:0;background:var(--surf);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.pimg{height:138px;position:relative;overflow:hidden;background:var(--surf2);display:grid;place-items:center;font-size:40px}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(8px)}
.pbody{padding:16px}
.pn{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{background:var(--green);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.pr{font-size:18px;margin:6px 0 14px}
.btn{width:100%;padding:11px;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;font-size:13.5px;box-shadow:var(--glow);transition:transform .15s}
.btn:active{transform:scale(.97)}
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 4px}
.chip{flex-shrink:0;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);background:transparent}
.chip:active{background:var(--accent);color:#fff}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.bar input{flex:1;min-width:0;padding:13px 18px;border-radius:99px;border:1.5px solid var(--line);background:var(--surf);color:var(--text);font-size:14.5px;outline:0;transition:border-color .2s,box-shadow .2s}
.bar input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,92,10,.13)}
.bagb{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:var(--surf);color:var(--accent);border:1.5px solid var(--line);box-shadow:0 3px 10px rgba(0,0,0,.08);transition:transform .12s}.bagb:active{transform:scale(.92)}
.send.off{background:var(--surf2);color:var(--mut);box-shadow:none}.send{transition:all .2s}
.dchip{align-self:center;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:5px 12px;border-radius:99px;background:var(--surf2);margin:2px 0 0}
.secn{align-self:center;text-align:center;font-size:11.5px;font-weight:600;color:var(--mut);padding:7px 14px;border-radius:14px;background:rgba(18,192,98,.09);border:1px solid rgba(18,192,98,.22);margin:6px 18px 8px}
.mr{display:flex;align-items:flex-end;gap:8px;animation:pop .28s cubic-bezier(.2,.8,.2,1)}.mr.gs{margin-top:14px}.mr.cn{margin-top:8px}.mr.me{justify-content:flex-end}
.mav{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:14px;border:1.5px solid transparent;background:linear-gradient(var(--surf),var(--surf)) padding-box,var(--grad) border-box;margin-bottom:1px}.mav.sp{visibility:hidden}
.mc{display:flex;flex-direction:column;gap:10px;max-width:80%;min-width:0}.mr.me .mc{align-items:flex-end}
.bb{padding:12px 16px;border-radius:20px;font-size:14.5px;line-height:1.55;word-break:break-word;white-space:pre-line}
.bb.bot{background:var(--surf);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,.07);align-self:flex-start}
.bb.me{background:var(--grad);color:#fff;border-bottom-right-radius:6px;font-weight:500;box-shadow:0 6px 16px rgba(255,92,10,.28)}
.mt{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut);font-weight:600;margin:0 4px}
.tk{overflow:visible;filter:drop-shadow(0 0 3px rgba(18,192,98,.55))}.tk path{stroke-dasharray:1;stroke-dashoffset:1;animation:tkd .3s ease forwards}.tk .t1{animation-delay:.1s}.tk .t2{animation-delay:.65s}
@keyframes tkd{to{stroke-dashoffset:0}}
.sysm{align-self:center;font-size:11.5px;font-weight:700;color:var(--mut);padding:6px 13px;border-radius:99px;background:var(--surf2);margin:10px 0 2px;animation:pop .25s ease}
.qrs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 14px 2px;animation:pop .3s ease}.qrs::-webkit-scrollbar{display:none}
.qr{flex-shrink:0;font-size:13px;font-weight:700;padding:9px 15px;border-radius:99px;border:1.5px solid transparent;background:linear-gradient(var(--surf),var(--surf)) padding-box,var(--grad) border-box;color:var(--text);box-shadow:0 3px 10px rgba(255,92,10,.14);transition:transform .12s}.qr:active{transform:scale(.94)}
.qr.pri{background:var(--green);color:#fff;border-color:transparent;box-shadow:var(--gglow)}
.rcpt{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:14px 16px;min-width:236px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.rcpt h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.rr{display:flex;justify-content:space-between;gap:14px;font-size:13px;padding:4px 0}.rr span{color:var(--mut)}.rr b{font-weight:700;text-align:right}
.rr.tot{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:10px;font-size:15px}
.okc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;border:1px solid rgba(18,192,98,.38);background:rgba(18,192,98,.09)}
.okc i{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;box-shadow:var(--gglow);flex-shrink:0}
.okc b{display:block;font-size:14px}.okc small{color:var(--mut);font-size:12px}
.send{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:var(--glow);flex-shrink:0}
.card{background:var(--surf);border:1px solid var(--cardline);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--card)}
.ch{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;margin-bottom:4px}
.st{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:99px;background:rgba(255,92,10,.14);color:var(--accent)}
.st.ok{background:rgba(18,192,98,.15);color:#0fb85b}
.st.mu{background:var(--surf2);color:var(--mut)}
.bd{font-size:13.5px;color:var(--mut);margin:0;line-height:1.55}
.feed{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;min-height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111;color:#fff}
.slide>img,.slide>.fb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 14s ease-in-out infinite alternate}
.fb{display:grid;place-items:center;font-size:96px;background:linear-gradient(160deg,#2a1608,#000)}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.14)}}
.slide:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.55) 0,transparent 24%,transparent 38%,rgba(0,0,0,.88) 100%)}
.dtop{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 16px);left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;color:#fff;pointer-events:none}
.dtop>*{pointer-events:auto}
.dtop .ico{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(14px)}
.live{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 26px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;display:flex;gap:6px;align-items:center;pointer-events:none;opacity:.9}
.live:before{content:"";width:6px;height:6px;border-radius:50%;background:#ff6a00;box-shadow:0 0 10px #ff6a00}
.dots{position:absolute;z-index:6;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px}
.dots i{width:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.4);transition:all .25s}
.dots i.on{height:20px;background:var(--grad)}
.side{position:absolute;z-index:6;right:14px;bottom:128px;display:flex;flex-direction:column;gap:16px;align-items:center;color:#fff}
.side button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.side span.c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);transition:transform .15s}
.side button:active span.c{transform:scale(.88)}
.pwrap{position:absolute;z-index:6;left:0;right:76px;bottom:104px;padding:0 0 0 18px;transition:transform .4s cubic-bezier(.3,.8,.3,1);touch-action:pan-y}
.pwrap.out{transform:translateX(calc(-100% + 0px))}
.price{display:inline-block;font-size:14px;font-weight:800;padding:6px 14px;border-radius:99px;background:var(--green);box-shadow:var(--gglow);margin-bottom:10px;color:#fff}
.hl{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.cap{font-size:13.5px;color:rgba(255,255,255,.82);margin:0 0 14px}
.glass{padding:16px;border-radius:24px;background:rgba(18,18,22,.4);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.2);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.glass .btn{margin-top:14px}
.grip{display:flex;justify-content:center;margin:-4px 0 10px}.grip i{width:36px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.pull{position:absolute;z-index:6;left:0;bottom:150px;display:flex;align-items:center;gap:6px;padding:10px 14px 10px 8px;border-radius:0 20px 20px 0;background:rgba(18,18,22,.55);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2);border-left:0;font-size:20px;color:#fff;transition:transform .4s cubic-bezier(.3,.8,.3,1)}
.pull.hide{transform:translateX(-110%)}
.navw{z-index:30;padding:6px 14px calc(env(safe-area-inset-bottom,0px) + 14px);background:transparent}
.nav{display:flex;padding:8px;border-radius:26px;background:var(--nav);border:1px solid var(--cardline);box-shadow:var(--shadow)}
.navw.d{position:absolute;left:0;right:0;bottom:0}
.navw.d .nav{background:rgba(20,20,24,.55);backdrop-filter:blur(22px);border-color:rgba(255,255,255,.18)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;color:#98a2b8;font-size:11.5px;font-weight:600;transition:color .2s,transform .15s}
.nav button.act{color:#ff5c0a}
.nav button:active{transform:scale(.94)}

.post{margin:0 0 22px;border-radius:28px;background:var(--surf);box-shadow:var(--card);overflow:hidden}
.ph{display:flex;align-items:center;gap:12px;padding:14px 14px 8px}
.pav{width:46px;height:46px;border-radius:50%;padding:2px;background:var(--grad);flex-shrink:0}
.pav i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--surf2);border:2px solid var(--surf);font-style:normal;font-size:20px}
.fol{font-size:13px;font-weight:700;padding:7px 18px;border-radius:99px;background:var(--surf2);transition:all .2s}
.fol.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.pcap{padding:2px 16px 12px;font-size:13.5px;color:var(--text)}
.pm{position:relative;margin:0 8px;border-radius:22px;overflow:hidden}
.ps{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.ps::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;height:430px;position:relative;scroll-snap-align:start;overflow:hidden;background:var(--surf2)}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sl:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.45) 0,transparent 25%,transparent 42%,rgba(0,0,0,.9) 100%)}
.badge{position:absolute;z-index:3;top:14px;left:14px;font-size:11px;font-weight:700;letter-spacing:.08em;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);color:#fff}
.cnt{position:absolute;z-index:3;top:14px;right:14px;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);color:#fff}
.pinfo{position:absolute;z-index:3;left:16px;bottom:78px;color:#fff;right:90px}
.pt{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:30px;line-height:1.05;margin:0 0 8px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.pp{font-size:23px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rt{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:2px}.rt b{color:#ffb21a;letter-spacing:1px}

   <div className="svh"><div className="av" style={{width:38,height:38,fontSize:18}}>{x.icon}</div><div className="nm" style={{color:'#fff'}}><span>{x.name}</span><Verified s={15}/></div><span style={{flex:1}}/><button onClick={()=>setSt(null)} style={{color:'#fff',fontSize:26,padding:'0 4px'}} aria-label="Close">×</button></div>
   <button className="tz l" aria-label="Previous" onClick={()=>goStory(-1)}/><button className="tz r" aria-label="Next" onClick={()=>goStory(1)}/>
   <div className="svt"><h3 className="pt">{x.prods[0][0]}</h3><div className="pp">{ksh(x.prods[0][1])}</div></div>
   <div className="bar svr"><input placeholder={'Reply to '+x.name+'…'} value={sr} onChange={e=>setSr(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&sr.trim()){const m=sr.trim();setSt(null);open(x,m)}}}/><button className="send" aria-label="Send" onClick={()=>{if(sr.trim()){const m=sr.trim();setSt(null);open(x,m)}}}><Ic.Send/></button></div></div>})()}
  {promo&&<div className="ov sheetw" onClick={()=>setPromo(null)}><div className="sheet" onClick={e=>e.stopPropagation()}><div className="grip"><i/></div><div className="nm" style={{padding:'0 20px 10px',justifyContent:'center'}}>Promote this deal</div>
   <div style={{padding:'0 20px 20px',maxHeight:'68vh',overflowY:'auto'}}><div className="sect" style={{padding:'0 0 8px'}}>Photos for your post ({psel.length} selected)</div><p className="bd" style={{margin:'0 0 10px'}}>Tap photos to include them in the order people will swipe, or add your own.</p><div className="hs" style={{gap:10}}><label className="pt3 addp"><span>+</span><small>Add photos</small><input type="file" accept="image/*" multiple hidden onChange={addPromoPhotos}/></label>{plist.map((im,i)=>{const k=psel.indexOf(i);return <button key={i} className={'pt3 pk'+(k>-1?' on':'')} onClick={()=>setPsel(v=>k>-1?v.filter(x=>x!==i):[...v,i])}><img src={im} alt=""/>{k>-1&&<span className="ck">{k+1}</span>}</button>})}</div>
    <div className="nm" style={{marginTop:12}}>{promo.name}</div>
    <div className="tm" style={{marginTop:4}}>{promo.by} · {ksh(promo.price)} · You earn {ksh(cmm(promo))} ({promo.pct}%)</div>
    <textarea className="fi" rows={3} placeholder="Write a caption" value={pcap} onChange={e=>setPcap(e.target.value)}/>
    <button className="btn" style={{marginTop:14}} onClick={publishDeal}>Publish post</button></div></div></div>}
  {fopen&&<div className="ov sheetw" onClick={()=>setFopen(false)}><div className="sheet" onClick={e=>e.stopPropagation()}><div className="grip"><i/></div><div className="nm" style={{padding:'0 20px 10px',justifyContent:'center'}}>Filter deals</div>
   <div style={{padding:'0 20px 20px',maxHeight:'68vh',overflowY:'auto'}}>
    {fg('Sort by',[['earn','Highest earnings'],['comm','Highest commission rate'],['low','Lowest price'],['high','Highest price']],'sort')}
    {fg('Commission rate',[[0,'Any'],[10,'10%+'],[20,'20%+'],[30,'30%+'],[40,'40%+']],'min')}
    {fg('Price',[['any','Any'],['u2','Under 2,000'],['m','2,000 – 5,000'],['o5','Over 5,000']],'price')}
    {fg('Shop / category',cats.map(c=>[c,c]),'cat')}
    {fg('Availability',[[false,'All'],[true,'In stock only']],'stock')}
    <div style={{display:'flex',gap:10,marginTop:20}}><button className="btn" style={{flex:1,background:'var(--surf2)',color:'var(--text)',boxShadow:'none'}} onClick={resetF}>Reset</button><button className="btn" style={{flex:2}} onClick={()=>setFopen(false)}>Show {dealList.length} deal{dealList.length===1?'':'s'}</button></div></div></div></div>}
  {edp&&<div className="ov sheetw" onClick={()=>setEdp(null)}><div className="sheet" onClick={e=>e.stopPropagation()}><div className="grip"><i/></div><div className="nm" style={{padding:'0 20px 10px',justifyContent:'center'}}>Edit live post</div>
   <div style={{padding:'0 20px 20px',maxHeight:'68vh',overflowY:'auto'}}><div className="sect" style={{padding:'0 0 8px'}}>Photos ({edp.sel.length} selected)</div><p className="bd" style={{margin:'0 0 10px'}}>Tap to add or remove photos. Numbers show the order people swipe.</p><div className="hs" style={{gap:10}}><label className="pt3 addp"><span>+</span><small>Add photos</small><input type="file" accept="image/*" multiple hidden onChange={addEditPhotos}/></label>{edp.list.map((im,i)=>{const k=edp.sel.indexOf(i);return <button key={i} className={'pt3 pk'+(k>-1?' on':'')} onClick={()=>setEdp(v=>({...v,sel:k>-1?v.sel.filter(x=>x!==i):[...v.sel,i]}))}><img src={im} alt=""/>{k>-1&&<span className="ck">{k+1}</span>}</button>})}</div>
    <input className="fi" placeholder="Post title" value={edp.name} onChange={e=>setEdp(v=>({...v,name:e.target.value}))}/>
    <textarea className="fi" rows={3} placeholder="Write a caption" value={edp.cap} onChange={e=>setEdp(v=>({...v,cap:e.target.value}))}/>
    <button className="btn" style={{marginTop:14}} onClick={saveEdit}>Save changes</button></div></div></div>}
  {toast&&<div className="toast">{toast}</div>}

  {!chat&&<div className="navw"><nav className="nav">
   {nav.map(([k,l,Icon])=>{const b=k==='inbox'?Object.values(unread).reduce((a,c)=>a+c,0):k==='alerts'?STORES.filter(x=>!readA[x.id]).length:0;return <button key={k} className={tab===k?'act':''} onClick={()=>{setTab(k);if(k==='inbox')setChat(null)}}><span className="ni"><Icon/>{b>0&&<span className="nb">{b}</span>}</span><span>{l}</span></button>})}
  </nav></div>}
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
