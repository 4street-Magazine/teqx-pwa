<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TeQx – Chat, Discover, Shop</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap');
:root{--green:linear-gradient(135deg,#34e68a 0%,#12c062 50%,#079244 100%);--gglow:0 6px 16px rgba(18,192,98,.4);--grad:linear-gradient(135deg,#ff8f1c 0%,#ff5c0a 48%,#f03a0e 100%);--accent:#ff5c0a;--glow:0 6px 18px rgba(255,92,10,.42)}
[data-theme=dark]{--bg:#0a0a0c;--surf:#151519;--surf2:#1e1e24;--text:#f5f5f7;--mut:#9b9ba8;--line:rgba(255,255,255,.1);--nav:#1a1a20;--shadow:0 10px 34px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.5);--card:0 6px 20px rgba(0,0,0,.35);--cardline:rgba(255,255,255,.1)}
[data-theme=light]{--bg:#faf7f4;--surf:#fff;--surf2:#f3eee9;--text:#17120e;--mut:#6f655c;--line:rgba(30,20,10,.09);--nav:#fff;--shadow:0 -4px 24px rgba(40,25,10,.08),0 8px 24px rgba(40,25,10,.14);--card:0 6px 20px rgba(40,25,10,.1);--cardline:rgba(30,20,10,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.scroll{overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.hs{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}
.app{max-width:448px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg);transition:background .3s}
.hdr{padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 14px;background:var(--bg);z-index:10}
.hrow{display:flex;align-items:center;justify-content:space-between}
.hdr .sub{margin:8px 0 0}
.brand{font-size:26px;font-weight:800;letter-spacing:-.03em}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surf);border:1px solid var(--line);color:var(--accent);transition:transform .15s}
.ico:active{transform:scale(.92)}
main{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.page{flex:1;overflow-y:auto;scrollbar-width:none;padding:18px 20px 24px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 20px}
.stories{padding:4px 20px 16px}
.tray{flex-shrink:0;padding-top:16px;padding-bottom:10px;background:var(--bg);z-index:5}
.story{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:68px}
.ring{width:64px;height:64px;border-radius:50%;background:var(--grad);padding:2.5px;position:relative}
.ring i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--surf);font-size:26px;font-style:normal;border:2px solid var(--bg)}
.dot{position:absolute;right:1px;bottom:1px;width:15px;height:15px;border-radius:50%;background:#22c55e;border:3px solid var(--bg)}
.story span{font-size:12px;font-weight:600;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sect{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 20px 8px}
.row{display:flex;align-items:center;gap:14px;padding:14px 20px;width:100%;text-align:left;transition:background .15s}
.row:active{background:var(--surf)}
.av{width:52px;height:52px;border-radius:50%;background:var(--surf2);display:grid;place-items:center;font-size:24px;flex-shrink:0;border:1px solid var(--line)}
.grow{flex:1;min-width:0}
.nm{display:flex;align-items:center;gap:5px;font-size:15.5px;font-weight:700}
.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{font-size:13px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.tm{font-size:11.5px;color:var(--mut)}
.pill{font-size:11.5px;font-weight:700;color:#fff;background:var(--grad);border-radius:99px;min-width:21px;padding:2px 7px;text-align:center}
.chat{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:20}
.chdr{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:var(--surf)}
.back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surf2)}
.chdr .av{width:42px;height:42px;font-size:20px}
.on{font-size:12px;font-weight:600;color:#22c55e;margin-top:1px}
.msgs{flex:1;overflow-y:auto;scrollbar-width:none;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.b{max-width:82%;padding:11px 15px;border-radius:20px;font-size:14px;line-height:1.55;animation:pop .25s ease}
.b.bot{background:var(--surf2);border-bottom-left-radius:6px;align-self:flex-start}
.b.me{background:var(--grad);color:#fff;border-bottom-right-radius:6px;align-self:flex-end;font-weight:500}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
.cat{padding:14px 30px 46px;margin:-14px -30px -40px;animation:pop .3s ease;background:transparent}
.prod{width:208px;flex-shrink:0;background:var(--surf);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.pimg{height:138px;position:relative;overflow:hidden;background:var(--surf2);display:grid;place-items:center;font-size:40px}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(8px)}
.pbody{padding:14px}
.pn{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{background:var(--green);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.pr{font-size:18px;margin:3px 0 12px}
.btn{width:100%;padding:11px;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;font-size:13.5px;box-shadow:var(--glow);transition:transform .15s}
.btn:active{transform:scale(.97)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 16px 0}
.chip{flex-shrink:0;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);background:transparent}
.chip:active{background:var(--accent);color:#fff}
.bar{display:flex;gap:10px;align-items:center;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--bg)}
.bar input{flex:1;padding:13px 18px;border-radius:99px;border:1px solid var(--line);background:var(--surf);color:var(--text);font-size:14px;outline:0}
.bar input:focus{border-color:var(--accent)}
.send{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:var(--glow);flex-shrink:0}
.card{background:var(--surf);border:1px solid var(--cardline);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--card)}
.ch{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;margin-bottom:4px}
.st{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:99px;background:rgba(255,92,10,.14);color:var(--accent)}
.st.ok{background:rgba(18,192,98,.15);color:#0fb85b}
.st.mu{background:var(--surf2);color:var(--mut)}
.bd{font-size:13.5px;color:var(--mut);margin:0;line-height:1.55}
.feed{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;min-height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111;color:#fff}
.slide>img,.slide>.fb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 14s ease-in-out infinite alternate}
.fb{display:grid;place-items:center;font-size:96px;background:linear-gradient(160deg,#2a1608,#000)}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.14)}}
.slide:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.55) 0,transparent 24%,transparent 38%,rgba(0,0,0,.88) 100%)}
.dtop{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 16px);left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;color:#fff;pointer-events:none}
.dtop>*{pointer-events:auto}
.dtop .ico{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(14px)}
.live{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 26px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;display:flex;gap:6px;align-items:center;pointer-events:none;opacity:.9}
.live:before{content:"";width:6px;height:6px;border-radius:50%;background:#ff6a00;box-shadow:0 0 10px #ff6a00}
.dots{position:absolute;z-index:6;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px}
.dots i{width:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.4);transition:all .25s}
.dots i.on{height:20px;background:var(--grad)}
.side{position:absolute;z-index:6;right:14px;bottom:128px;display:flex;flex-direction:column;gap:16px;align-items:center;color:#fff}
.side button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.side span.c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);transition:transform .15s}
.side button:active span.c{transform:scale(.88)}
.pwrap{position:absolute;z-index:6;left:0;right:76px;bottom:104px;padding:0 0 0 18px;transition:transform .4s cubic-bezier(.3,.8,.3,1);touch-action:pan-y}
.pwrap.out{transform:translateX(calc(-100% + 0px))}
.price{display:inline-block;font-size:14px;font-weight:800;padding:6px 14px;border-radius:99px;background:var(--green);box-shadow:var(--gglow);margin-bottom:10px;color:#fff}
.hl{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.cap{font-size:13.5px;color:rgba(255,255,255,.82);margin:0 0 14px}
.glass{padding:16px;border-radius:24px;background:rgba(18,18,22,.4);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.2);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.glass .btn{margin-top:14px}
.grip{display:flex;justify-content:center;margin:-4px 0 10px}.grip i{width:36px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.pull{position:absolute;z-index:6;left:0;bottom:150px;display:flex;align-items:center;gap:6px;padding:10px 14px 10px 8px;border-radius:0 20px 20px 0;background:rgba(18,18,22,.55);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2);border-left:0;font-size:20px;color:#fff;transition:transform .4s cubic-bezier(.3,.8,.3,1)}
.pull.hide{transform:translateX(-110%)}
.navw{z-index:30;padding:6px 14px calc(env(safe-area-inset-bottom,0px) + 14px);background:transparent}
.nav{display:flex;padding:8px;border-radius:26px;background:var(--nav);border:1px solid var(--cardline);box-shadow:var(--shadow)}
.navw.d{position:absolute;left:0;right:0;bottom:0}
.navw.d .nav{background:rgba(20,20,24,.55);backdrop-filter:blur(22px);border-color:rgba(255,255,255,.18)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;color:#98a2b8;font-size:11.5px;font-weight:600;transition:color .2s,transform .15s}
.nav button.act{color:#ff5c0a}
.nav button:active{transform:scale(.94)}

.post{margin:0 0 22px;border-radius:28px;background:var(--surf);box-shadow:var(--card);overflow:hidden}
.ph{display:flex;align-items:center;gap:12px;padding:14px 14px 8px}
.pav{width:46px;height:46px;border-radius:50%;padding:2px;background:var(--grad);flex-shrink:0}
.pav i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--surf2);border:2px solid var(--surf);font-style:normal;font-size:20px}
.fol{font-size:13px;font-weight:700;padding:7px 18px;border-radius:99px;background:var(--surf2);transition:all .2s}
.fol.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.pcap{padding:2px 16px 12px;font-size:13.5px;color:var(--text)}
.pm{position:relative;margin:0 8px;border-radius:22px;overflow:hidden}
.ps{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.ps::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;height:430px;position:relative;scroll-snap-align:start;overflow:hidden;background:var(--surf2)}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sl:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.45) 0,transparent 25%,transparent 42%,rgba(0,0,0,.9) 100%)}
.badge{position:absolute;z-index:3;top:14px;left:14px;font-size:11px;font-weight:700;letter-spacing:.08em;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);color:#fff}
.cnt{position:absolute;z-index:3;top:14px;right:14px;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);color:#fff}
.pinfo{position:absolute;z-index:3;left:16px;bottom:78px;color:#fff;right:90px}
.pt{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:30px;line-height:1.05;margin:0 0 8px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.pp{font-size:23px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rt{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:2px}.rt b{color:#ffb21a;letter-spacing:1px}
.perks{position:absolute;z-index:3;right:12px;bottom:84px;display:flex;flex-direction:column;gap:10px}
.perk{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;color:#fff;line-height:1.15;width:76px}
.perk i{width:36px;height:36px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:15px;background:rgba(20,20,24,.55);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18)}
.cta{position:absolute;z-index:3;left:12px;right:12px;bottom:12px;display:flex;gap:10px}
.cta button{flex:1;padding:13px 8px;border-radius:99px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .15s}
.cta button:active{transform:scale(.96)}
.cta .g{background:rgba(20,20,24,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);color:#fff}
.cta .o{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.acts{display:flex;align-items:center;gap:20px;padding:14px 18px 4px;font-size:14px;font-weight:600}
.acts button{display:flex;align-items:center;gap:7px}
.hashes{padding:6px 18px 18px;font-size:13px;color:var(--mut)}.hashes b{color:var(--text)}.hashes u{text-decoration:none;color:#3b9cff}
.toast{position:absolute;z-index:50;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--grad);color:#fff;font-weight:700;font-size:13px;padding:10px 18px;border-radius:99px;box-shadow:var(--glow);animation:pop .25s ease;white-space:nowrap}
.pbig{width:92px;height:92px;border-radius:50%;background:var(--grad);padding:3px;margin:8px auto 12px}.pbig i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--surf2);font-style:normal;font-size:40px;border:3px solid var(--bg)}
.stats{display:flex;justify-content:space-around;text-align:center;margin:18px 0}.stats b{display:block;font-size:20px;font-weight:800}.stats span{font-size:12px;color:var(--mut)}
.plus{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;border:2.5px solid var(--bg);font-size:14px;line-height:1}

/* ===== HIGH-END DISCOVER ===== */
[data-theme=dark]{--gold:#ff7a2b}[data-theme=light]{--gold:#e8470a}
.hdr{padding-bottom:6px}
.brand{font-size:28px;letter-spacing:-.04em}
.stories{padding:6px 20px 18px}
.ring{width:66px;height:66px;padding:2px;background:conic-gradient(from 210deg,#ff9a2e,#ff5c0a,#e8320f,#ff7a1a,#ff9a2e);box-shadow:0 6px 18px rgba(255,92,10,.32)}
.ring i{border:3px solid var(--bg)}
.story span{font-size:11.5px;font-weight:600;color:var(--mut);letter-spacing:.01em}
.post{margin:0 0 30px;background:transparent;box-shadow:none;border-radius:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.ph{padding:0 6px 12px}
.pav{width:44px;height:44px;padding:1.5px;background:conic-gradient(from 210deg,#ff9a2e,#e8470a,#ff9a2e)}
.fol{background:transparent;border:1px solid var(--gold);color:var(--gold);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:7px 16px}
.fol.on{background:var(--grad);border-color:transparent;color:#fff}
.pcap{padding:0 6px 14px;color:var(--mut);font-size:13.5px;line-height:1.55}.pcap b{color:var(--text)}
.pm{margin:0;border-radius:34px;box-shadow:0 24px 50px -12px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07)}
.sl{height:370px}
.sl:before{background:linear-gradient(180deg,rgba(0,0,0,.5) 0,transparent 22%,transparent 40%,rgba(8,6,4,.55) 66%,rgba(8,6,4,.95) 100%)}
.badge{top:18px;left:18px;font-size:10px;letter-spacing:.18em;font-weight:700;padding:7px 13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(16px)}
.shopchip{position:absolute;z-index:3;top:18px;right:18px;font-size:11px;font-weight:600;color:#fff;padding:7px 13px;border-radius:99px;background:rgba(0,0,0,.35);backdrop-filter:blur(16px);display:none}
.seg{position:absolute;z-index:3;top:18px;right:18px;display:flex;gap:5px}
.seg i{width:22px;height:3px;border-radius:9px;background:rgba(255,255,255,.35);transition:background .3s}
.seg i.on{background:#fff}
.pinfo{left:22px;bottom:96px;right:84px}
.pt{font-family:'Cormorant Garamond',Georgia,serif;font-size:40px;line-height:.98;font-weight:700;letter-spacing:-.01em;margin:0 0 12px}
.pp{font-size:22px;font-weight:700;letter-spacing:.01em;background:linear-gradient(135deg,#8dffbd 0%,#2be67f 45%,#0fbf5f 100%);filter:drop-shadow(0 2px 10px rgba(30,230,120,.35));-webkit-background-clip:text;background-clip:text;color:transparent}
.rt{font-size:12px;letter-spacing:.04em;margin-top:6px;color:rgba(255,255,255,.75)}.rt b{color:#ff9a3d;letter-spacing:0}
.perks{right:14px;bottom:100px;flex-direction:column;gap:2px;padding:6px;border-radius:99px;background:rgba(255,255,255,.1);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2)}
.perk{width:auto}.perk i{background:transparent;border:0;width:38px;height:38px;font-size:16px}
.cta{left:14px;right:14px;bottom:14px;padding:6px;border-radius:99px;background:rgba(14,12,10,.5);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.16);gap:6px}
.cta button{padding:15px 8px;font-size:15px;letter-spacing:.02em}
.cta .g{background:transparent;border:0}
.cta .o{box-shadow:0 8px 24px rgba(255,92,10,.5)}
.acts{padding:16px 6px 4px;gap:22px;color:var(--text)}
.hashes{padding:6px 6px 0;line-height:1.7}.hashes b{font-weight:700}.hashes u{color:var(--gold)}

.folw{position:relative}
.folw.out{animation:fadeout .5s ease 1.2s forwards}
@keyframes fadeout{to{opacity:0;transform:scale(.85)}}
.sp{position:absolute;left:50%;top:50%;font-size:11px;color:#ff9a3d;pointer-events:none;opacity:0;animation:spk .9s ease-out forwards;text-shadow:0 0 8px rgba(255,120,20,.9)}
.sp:nth-child(odd){color:#ffc98a}
@keyframes spk{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0) scale(.4)}60%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(-1*var(--d))) scale(1.2)}}
.sw{width:46px;height:28px;border-radius:99px;background:var(--surf2);position:relative;transition:background .25s;flex-shrink:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on{background:var(--grad)}.sw.on:after{transform:translateX(18px)}
.stk{position:sticky;top:0;z-index:8;margin:0 -16px 8px!important;padding:10px 20px 14px!important;background:var(--bg);top:-1px}
.tagl{display:flex;align-items:center;gap:7px;margin-top:-2px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--mut)}
.tagl i{width:7px;height:7px;border-radius:50%;background:#22e07a;box-shadow:0 0 0 0 rgba(34,224,122,.6);animation:pls 1.8s infinite}
@keyframes pls{70%{box-shadow:0 0 0 7px rgba(34,224,122,0)}100%{box-shadow:0 0 0 0 rgba(34,224,122,0)}}
.tagl i{position:relative;background:#22e07a;box-shadow:0 0 8px rgba(34,224,122,.8);animation:none}
.tagl i:after{content:"";position:absolute;inset:0;border-radius:50%;background:#22e07a;animation:ping 1.5s cubic-bezier(0,0,.2,1) infinite;pointer-events:none}
.dot{background:#22e07a}
@keyframes ping{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.8);opacity:0}}
/* spacing + type hierarchy */
.hdr{padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 14px}
.brand{line-height:1.1}
.tagl,.hdr .sub{display:block;margin:10px 0 0;font-size:13px;font-weight:500;letter-spacing:.01em;line-height:1.4;color:var(--mut)}
.page{padding-top:20px}
.sect{font-size:11.5px;letter-spacing:.1em;padding-bottom:10px}
.row{padding:15px 20px;gap:16px}
.nm{font-size:15px;font-weight:700;line-height:1.3}
.pv{font-size:13px;margin-top:3px}
.tm{font-size:12px}
.card{padding:18px;margin-bottom:18px}
.ch{padding-bottom:14px;margin-bottom:8px}
.bd{font-size:13px;line-height:1.6}
.story{gap:10px}
.stk{padding:12px 20px 16px!important}
.post{margin-bottom:36px}
.ph{padding:0 4px 14px;gap:14px}
.pcap{padding:0 4px 16px;font-size:13px;line-height:1.6}
.acts{padding:18px 4px 6px;gap:24px;font-size:13px}
.hashes{padding:10px 4px 0;font-size:12.5px}
.pt{font-size:36px;margin-bottom:12px}
.pp{font-size:21px}
.rt{font-size:12px;margin-top:8px}
h1{font-size:24px;margin-bottom:6px}
.sub{font-size:13px}
.stats{margin:24px 0}
</style>

<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const I=({s=20,f='none',children})=><svg width={s} height={s} viewBox="0 0 24 24" fill={f} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>;
const Ic={

 Sun:()=><I s={19}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></I>,

 Discover:()=><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path fillRule="evenodd" d="M12 2a10 10 0 1 0 0 20a10 10 0 0 0 0-20zM16.500 7.500l-2.200 6.800l-6.800 2.200l2.200-6.800z"/></svg>,
 Bag:()=><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round"><path d="M6 7h12l1.200 13a1 1 0 0 1-1 1.100H5.800a1 1 0 0 1-1-1.100z"/><path d="M9 9V6.500a3 3 0 0 1 6 0V9" fill="none"/></svg>,
 Bell:()=><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.500 7.500 2.500 7.500h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0" fill="none"/></svg>,
 User:()=><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><circle cx="12" cy="8" r="4.200"/><path d="M4 21c0-4.200 3.500-7 8-7s8 2.800 8 7z"/></svg>,
 Search:()=><I s={19}><circle cx="11" cy="11" r="7"/><path d="m21 21-4.300-4.300"/></I>,
 Cart:()=><I s={18}><path d="M6 7h12l1.200 13H4.800zM9 7a3 3 0 0 1 6 0"/></I>,
 Heart:({on})=><I s={22} f={on?'#ff4d2e':'none'}><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.500 2-1.500-1.500-2.700-2-4.500-2A5.5 5.5 0 0 0 2 8.500c0 2.300 1.500 4 3 5.500l7 7z"/></I>,
 Msg:()=><I s={22}><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></I>,
 Mark:({on})=><I s={22} f={on?'currentColor':'none'}><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></I>,
 Share:()=><I s={22}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></I>,
 Send:()=><I s={18}><path d="m22 2-11 11M22 2l-7 20-4-9-9-4z"/></I>,
 Back:()=><I s={18}><path d="m15 18-6-6 6-6"/></I>
};
const Verified=({s=16})=><svg width={s} height={s} viewBox="0 0 24 24" style={{flexShrink:0}} aria-label="Verified shop"><path fill="#0b3fd1" d="M22.250 12c0-1.430-.88-2.670-2.190-3.340.46-1.390.2-2.900-.81-3.910s-2.520-1.270-3.910-.81c-.66-1.310-1.910-2.190-3.340-2.190s-2.670.88-3.330 2.190c-1.400-.46-2.910-.2-3.920.81s-1.260 2.520-.8 3.910C2.640 9.330 1.750 10.570 1.750 12s.89 2.670 2.200 3.340c-.46 1.390-.21 2.900.8 3.910s2.520 1.260 3.910.81c.67 1.310 1.910 2.190 3.340 2.190s2.680-.88 3.340-2.190c1.390.45 2.900.2 3.910-.81s1.270-2.520.81-3.910c1.310-.67 2.190-1.910 2.190-3.340z"/><path d="m8.500 12.300 2.400 2.400 4.700-4.900" fill="none" stroke="#fff" strokeWidth="2.200" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const ksh=n=>'KSh '+n.toLocaleString('en-KE');
const U=(id)=>`https://images.unsplash.com/${id}?w=600&q=80`;
const STORES=[
 {id:'apex',name:'Apex Tech',tag:'#TechGear',icon:'⚡',msg:'Your order has been confirmed.',time:'19:54',unread:2,img:U('photo-1505740420928-5e560c06d30e'),prods:[['AcousticMax Headphones',18500],['Pulse Wireless Earbuds',7900],['Volt 20K Power Bank',3200]]},
 {id:'luxe',name:'Luxe Attire',tag:'#Streetwear',icon:'👕',msg:'New styles drop tonight!',time:'18:30',unread:0,img:U('photo-1515886657613-9f3515b0c78f'),prods:[['Premium Cotton Hoodie',6200],['Essential Oversized Tee',2400],['Street Cargo Joggers',4800]]},
 {id:'nova',name:'Nova Beauty',tag:'#Skincare',icon:'💄',msg:'Your beauty picks are ready to view.',time:'16:12',unread:1,img:U('photo-1608248597481-496100c80836'),prods:[['Hydrating Glow Serum',4800],['Vitamin C Brightening Cream',3900],['Daily Mineral Sunscreen',2700]]},
 {id:'fresh',name:'Fresh Drops',tag:'#Essentials',icon:'🍏',msg:'Your organic produce crate is ready.',time:'Yesterday',unread:0,img:U('photo-1610832958506-aa56368176cf'),prods:[['Fresh Fruit Basket',3500],['Organic Veggie Crate',2800],['Cold-Pressed Juice Pack',1900]]},
 {id:'sole',name:'Sole Search',tag:'#Kicks',icon:'👟',msg:'Retro sneakers are back in stock!',time:'Yesterday',unread:3,img:U('photo-1542291026-7eec264c27ff'),prods:[['Air Max Retro Horizon',14000],['Classic Court Low',8500],['Trail Runner Pro',11200]]}
];
const CHIPS=['Show catalog','Track my order','Delivery info','Payment options','Talk to a person'];
const TAG={profile:'Your account & settings',inbox:'Chat with your favourite shops',orders:"Track everything you've bought",alerts:'Updates from the shops you follow'};
const STAT=[[4812,293,94],[2310,148,51],[3920,201,76],[1570,87,33],[6240,412,128]];
const CAP={apex:'Studio-grade sound with all-day battery. Drop 01 is live.',luxe:'Fresh streetwear, cut for the city. Limited pieces only.',nova:'Glow-first skincare made for everyday routines.',fresh:'Farm-fresh crates delivered to your door, same day.',sole:'Retro silhouettes are back. Grab your size before they go.'};
const fmt=n=>n>=1000?(n/1000).toFixed(1)+'k':n;
const Amt=({t})=>t.split(/(KSh [\d,]+)/).map((x,i)=>/^KSh /.test(x)?<span key={i} className="amt">{x}</span>:x);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const STYLE=[{scale:1,pos:'center'},{scale:1.35,pos:'20% 30%'},{scale:1.6,pos:'85% 70%'}];

function Product({store,i,onBuy}){
 const [p,price]=store.prods[i],[bad,setBad]=useState(false);
 return <div className="prod">
  <div className="pimg">{bad?store.icon:<img src={store.img} alt={p} loading="lazy" onError={()=>setBad(true)} style={{transform:`scale(${STYLE[i].scale})`,objectPosition:STYLE[i].pos}}/>}<span className="tag">In stock</span></div>
  <div className="pbody"><div className="pn">{p}</div><div className="pr amt">{ksh(price)}</div><button className="btn" onClick={()=>onBuy(store,p,price)}>Buy now</button></div>
 </div>;
}

const PERKS=[['🚚','Fast Delivery'],['🛡️','Secure Payments'],['↩️','Easy Returns']];
function Post({s,si,f,onFollow,liked,onLike,saved,onSave,onChat,onBuy}){
 const [n,setN]=useState(0),[gone,setGone]=useState(false),[spark,setSpark]=useState(false);
 const doFollow=()=>{if(f)return;onFollow();setSpark(true);setTimeout(()=>setGone(true),1700)};
 return <article className="post">
  <div className="ph"><div className="pav"><i>{s.icon}</i></div>
   <div className="grow"><div className="nm"><span>{s.name}</span><Verified/></div><div className="tm">{si+2}h ago · {s.tag}</div></div>
   {!gone&&<div className={'folw'+(f?' out':'')}><button className={'fol'+(f?' on':'')} onClick={doFollow}>{f?'Following ✓':'Follow'}</button>{spark&&[...Array(8)].map((_,i)=><b key={i} className="sp" style={{'--a':i*45+'deg','--d':(i%2?26:36)+'px'}}>✦</b>)}</div>}</div>
  <div className="pcap"><b>New arrivals!</b> ✨ {CAP[s.id]}</div>
  <div className="pm">
   <div className="ps" onScroll={e=>setN(Math.round(e.target.scrollLeft/e.target.clientWidth))}>
    {s.prods.map((pr,i)=><div key={i} className="sl"><img src={s.img} alt={pr[0]} loading="lazy" style={{transform:`scale(${STYLE[i].scale})`,objectPosition:STYLE[i].pos}} onError={e=>{e.target.style.display='none'}}/></div>)}
   </div>
   <span className="badge">{n===0?'NEW ARRIVAL':'TRENDING'}</span><span className="shopchip">{s.icon} {s.name}</span><div className="seg">{[0,1,2].map(i=><i key={i} className={i<=n?'on':''}/>)}</div>
   <div className="pinfo"><h3 className="pt">{s.prods[n][0]}</h3><div className="pp">{ksh(s.prods[n][1])}</div><div className="rt"><b>★</b>  {(4.5+((si+n)%5)/10).toFixed(1)} ({128+si*37+n*11})</div></div>
   <div className="perks">{PERKS.map(([e,t])=><div key={t} className="perk" title={t}><i>{e}</i></div>)}</div>
   <div className="cta"><button className="o" onClick={onChat}><Ic.Cart/>Shop Now</button></div>
  </div>
  <div className="acts"><button onClick={onLike} style={liked?{color:'#ff4d2e'}:null}><Ic.Heart on={liked}/>{(842+si*173+(liked?1:0)).toLocaleString()}</button><button onClick={onChat}><Ic.Msg/>{56+si*9}</button><button><Ic.Share/>{32+si*5}</button><span style={{flex:1}}/><button onClick={onSave} style={saved?{color:'#ff8c1a'}:null}><Ic.Mark on={saved}/></button></div>
  <div className="hashes"><b>{s.name.toLowerCase().replace(' ','_')}</b> Classy. Confident. You. 💛<br/><u>{s.tag}</u> <u>#NewArrivals</u> <u>#NairobiMade</u></div>
 </article>;
}

function App(){
 const [dark,setDark]=useState(()=>{try{return localStorage.getItem('teqx-theme')!=='light'}catch(e){return true}});
 const [tab,setTab]=useState('discover');
 const [chat,setChat]=useState(null);
 const [text,setText]=useState('');
 const [chats,setChats]=useState({});
 const [typing,setTyping]=useState(false);
 const [unread,setUnread]=useState(Object.fromEntries(STORES.map(s=>[s.id,s.unread])));
 const [orders,setOrders]=useState([
  {id:'TQ-4821',store:STORES[0],item:STORES[0].prods[0][0],price:18500,status:'Out for delivery'},
  {id:'TQ-4790',store:STORES[1],item:STORES[1].prods[0][0],price:6200,status:'Placed'},
  {id:'TQ-4755',store:STORES[2],item:STORES[2].prods[0][0],price:4800,status:'Placed'}]);
 const [liked,setLiked]=useState({}),[saved,setSaved]=useState({});
 const [fol,setFol]=useState({}),[toast,setToast]=useState('');
 const flip=(set,id)=>set(m=>({...m,[id]:!m[id]}));
 const end=useRef(null),ordersRef=useRef(orders);ordersRef.current=orders;

 useEffect(()=>{document.documentElement.dataset.theme=dark?'dark':'light';try{localStorage.setItem('teqx-theme',dark?'dark':'light')}catch(e){}},[dark]);
 useEffect(()=>{end.current&&end.current.scrollIntoView({behavior:'smooth',block:'end'})},[chats,typing,chat]);

 const push=(id,m)=>setChats(c=>({...c,[id]:[...(c[id]||[]),{k:Math.random(),...m}]}));
 const say=async(id,msgs)=>{setTyping(true);for(const m of msgs){await wait(800);push(id,m);}setTyping(false)};

 const open=s=>{setTab('inbox');setChat(s);setUnread(u=>({...u,[s.id]:0}));
  if(!chats[s.id]){setChats(c=>({...c,[s.id]:[]}));say(s.id,[{from:'bot',text:`Karibu! 👋 Welcome to ${s.name}. I'm the shop's automated assistant. Browse our latest picks below, or tap a quick option.`},{from:'bot',catalog:true}])}};

 const reply=(s,t)=>{const q=t.toLowerCase();
  if(/catalog|show|price|cost|item|product/.test(q))return[{from:'bot',text:'Here are our top picks right now:'},{from:'bot',catalog:true}];
  if(/track|status|where/.test(q)){const o=ordersRef.current.find(o=>o.store.id===s.id);return[{from:'bot',text:o?`Your order ${o.id} (${o.item}) is currently: ${o.status}.`:'You have no orders with us yet. Tap "Buy now" on any item to place one.'}]}
  if(/deliver|ship/.test(q))return[{from:'bot',text:'We deliver within Nairobi in 24 hours and countrywide in 2–3 days. Delivery starts at KSh 250.'}];
  if(/pay|mpesa|m-pesa|card/.test(q))return[{from:'bot',text:'We accept M-Pesa, bank cards and cash on delivery.'}];
  if(/person|human|agent|help/.test(q))return[{from:'bot',text:'Connecting you to a team member. They usually reply within 10 minutes.'}];
  if(/hi|hello|hey|sasa|mambo/.test(q))return[{from:'bot',text:`Hello! 😊 How can I help you today at ${s.name}?`}];
  return[{from:'bot',text:'Thanks for your message! I can help with the catalog, order tracking, delivery and payments.'}]};

 const send=t=>{t=(t||'').trim();if(!t||typing)return;push(chat.id,{from:'me',text:t});setText('');say(chat.id,reply(chat,t))};

 const buy=async(s,item,price)=>{if(typing)return;
  const id='TQ-'+Math.floor(1000+Math.random()*9000);
  push(s.id,{from:'me',text:`I'd like to order: ${item}`});
  setOrders(o=>[{id,store:s,item,price,status:'Processing'},...o]);
  await say(s.id,[{from:'bot',text:`Order ${id} received ✅ — ${item} for ${ksh(price)}. We'll confirm shortly.`}]);
  await wait(5000);
  setOrders(o=>o.map(x=>x.id===id?{...x,status:'Confirmed'}:x));
  push(s.id,{from:'bot',text:`Good news! Order ${id} is confirmed and being packed. 📦`})};

 const quick=async(s,item,price)=>{const id='TQ-'+Math.floor(1000+Math.random()*9000);setOrders(o=>[{id,store:s,item,price,status:'Processing'},...o]);setToast(`Order ${id} placed ✅`);setTimeout(()=>setToast(''),2200);await wait(5000);setOrders(o=>o.map(x=>x.id===id?{...x,status:'Confirmed'}:x))};
 const lastBot=chat&&(chats[chat.id]||[]).length>0;
 const d=tab==='discover';
 const toggle=<button className="ico" aria-label="Toggle light or dark mode" onClick={()=>setDark(!dark)}>{dark?<Ic.Sun/>:<Ic.Moon/>}</button>;
 const brand=<div className="brand">Te<b>Q</b>x</div>;
 const nav=[['discover','Discover',Ic.Discover],['inbox','Inbox',Ic.Inbox],['orders','Orders',Ic.Bag],['alerts','Alerts',Ic.Bell],['profile','Profile',Ic.User]];

 return <div className="app">
  {!(tab==='inbox'&&chat)&&<header className="hdr"><div className="hrow"><div>{brand}{d&&<div className="tagl">Discover Shops</div>}</div><div style={{display:'flex',gap:10}}>{d&&<button className="ico" aria-label="Search"><Ic.Search/></button>}</div></div>{!d&&<p className="sub">{TAG[tab]}</p>}</header>}
  <main>
   {tab==='inbox'&&<>
    <div className="tray"><div className="hs stories">{STORES.map(s=><button key={s.id} className="story" onClick={()=>open(s)}><div className="ring"><i>{s.icon}</i><span className="dot"/></div><span>{s.name}</span></button>)}</div>
     <div className="sect" style={{paddingTop:14}}>Conversations</div></div>
    <div className="page" style={{padding:'4px 0 24px'}}>
    {STORES.map(s=>{const m=chats[s.id]&&[...chats[s.id]].reverse().find(x=>x.text);return <button key={s.id} className="row" onClick={()=>open(s)}>
     <div className="av">{s.icon}</div>
     <div className="grow"><div className="nm"><span>{s.name}</span><Verified/></div><div className="pv">{m?m.text:s.msg}</div></div>
     <div className="meta"><span className="tm">{s.time}</span>{unread[s.id]>0&&<span className="pill">{unread[s.id]}</span>}</div>
    </button>})}
   </div></>}

   {tab==='inbox'&&chat&&<div className="chat">
    <div className="chdr"><button className="back" aria-label="Back" onClick={()=>setChat(null)}><Ic.Back/></button><div className="av">{chat.icon}</div>
     <div className="grow"><div className="nm"><span>{chat.name}</span><Verified s={15}/></div><div className="on">● Auto-replies on</div></div></div>
    <div className="msgs">
     {(chats[chat.id]||[]).map(m=>m.catalog?<div key={m.k} className="hs cat">{[0,1,2].map(i=><Product key={i} store={chat} i={i} onBuy={buy}/>)}</div>:<div key={m.k} className={'b '+m.from}>{m.from==='bot'?<Amt t={m.text}/>:m.text}</div>)}
     {typing&&<div className="b bot typing"><i/><i/><i/></div>}
     <div ref={end}/>
    </div>
    {lastBot&&<div className="chips">{CHIPS.map(c=><button key={c} className="chip" onClick={()=>send(c)}>{c}</button>)}</div>}
    <div className="bar"><input placeholder="Type a message…" value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send(text)}/><button className="send" aria-label="Send" onClick={()=>send(text)}><Ic.Send/></button></div>
   </div>}

   {d&&<div className="page" style={{padding:'0 16px 24px'}}>
    <div className="hs stories stk">
     <button className="story"><div className="ring"><i>🙂</i><span className="plus">+</span></div><span>Your story</span></button>
     {STORES.map(s=><button key={s.id} className="story" onClick={()=>open(s)}><div className="ring"><i>{s.icon}</i><span className="dot"/></div><span>{s.name}</span></button>)}
    </div>
    {STORES.map((s,si)=><Post key={s.id} s={s} si={si} f={fol[s.id]} onFollow={()=>flip(setFol,s.id)} liked={liked[s.id]} onLike={()=>flip(setLiked,s.id)} saved={saved[s.id]} onSave={()=>flip(setSaved,s.id)} onChat={()=>open(s)} onBuy={(i,p)=>quick(s,i,p)}/>)}
   </div>}

   {tab==='orders'&&<div className="page">
    {orders.map(o=><div key={o.id} className="card"><div className="ch"><div className="nm" style={{fontSize:14.5}}><span style={{fontSize:20}}>{o.store.icon}</span><span>{o.store.name}</span><Verified s={15}/></div><span className={'st'+(o.status==='Placed'?' ok':'')}>{o.status}</span></div>
     <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12}}><div className="grow"><div style={{fontWeight:700,fontSize:14.5}}>{o.item}</div><div className="tm" style={{marginTop:3}}>{o.id} · Qty 1</div></div><div className="amt" style={{fontSize:16}}>{ksh(o.price)}</div></div></div>)}
   </div>}

   {tab==='alerts'&&<div className="page">
    {STORES.map((s,i)=><div key={s.id} className="card"><div className="ch"><div className="nm" style={{fontSize:14.5}}><span style={{fontSize:20}}>{s.icon}</span><span>{s.name}</span><Verified s={15}/></div><span className="st mu">{i+2}h ago</span></div>
     <p className="bd">{i%2===0?'Added new items to the catalog. Open the chat to see prices in KSh.':'Posted a new lookbook on your Discover feed. Take a look!'}</p></div>)}
   </div>}
   {tab==='profile'&&<div className="page">
    <div style={{textAlign:'center'}}><div className="pbig"><i>🙂</i></div><h1 style={{marginBottom:2}}>Your Profile</h1><p className="sub" style={{margin:0}}>@you · Nairobi, Kenya</p></div>
    <div className="stats"><div><b>{orders.length}</b><span>Orders</span></div><div><b>{Object.values(fol).filter(Boolean).length}</b><span>Following</span></div><div><b>{Object.values(saved).filter(Boolean).length}</b><span>Saved</span></div></div>
    <div className="card"><button className="row" style={{padding:0}} onClick={()=>setDark(!dark)}><div className="grow nm">Dark mode</div><span style={{display:'flex',alignItems:'center',gap:8,color:'var(--mut)',fontSize:13}}>{dark?<Ic.Moon/>:<Ic.Sun/>}{dark?'Dark':'Light'}</span><span className={'sw'+(dark?' on':'')}/></button></div>
    <div className="card"><div className="nm">Payment methods</div><p className="bd" style={{marginTop:4}}>M-Pesa · Cash on delivery</p></div>
    <div className="card"><div className="nm">Delivery address</div><p className="bd" style={{marginTop:4}}>Nairobi, Kenya</p></div>
   </div>}
  </main>
  {toast&&<div className="toast">{toast}</div>}

  {!chat&&<div className="navw"><nav className="nav">
   {nav.map(([k,l,Icon])=><button key={k} className={tab===k?'act':''} onClick={()=>{setTab(k);if(k==='inbox')setChat(null)}}><Icon/><span>{l}</span></button>)}
  </nav></div>}
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
